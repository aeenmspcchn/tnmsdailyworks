<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Log Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 antialiased">

  <!-- AUTH SCREEN OVERLAY -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 bg-opacity-95 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 transition-all">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-indigo-200">
          <i class="fa-solid fa-briefcase"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Work Log Portal</h2>
        <p class="text-sm text-gray-500 mt-1">Sign in with your user profile &amp; role</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Username / Identifier</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="loginUsername" required placeholder="e.g. john_doe" value="john_doe"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Role / Department</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid id-badge"></i>
            </span>
            <select id="loginRole" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
              <option value="Operator">Operator (Can edit own entries)</option>
              <option value="Supervisor">Supervisor (Can manage all entries)</option>
              <option value="Manager">Manager (Full oversight)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
      
      <div class="mt-6 pt-6 border-t border-gray-100 text-center text-xs text-gray-400">
        Multi-User Mode: Enter any name &amp; role to proceed
      </div>
    </div>
  </div>

  <!-- MAIN NAVIGATION HEADER -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow">
            <i class="fa-solid fa-clipboard-check text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-gray-900 leading-none">Work Log Portal</h1>
            <span class="text-xs text-gray-500">Activity &amp; Day-wise Reporting</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="hidden md:flex space-x-1 bg-gray-100 p-1 rounded-xl text-sm font-medium text-gray-600">
          <button id="navEntryTab" onclick="switchTab('entry')" class="nav-tab px-4 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm">
            <i class="fa-solid fa-plus-circle mr-1.5"></i>Log Activity
          </button>
          <button id="navReportTab" onclick="switchTab('report')" class="nav-tab px-4 py-1.5 rounded-lg transition hover:text-gray-900">
            <i class="fa-solid fa-chart-column mr-1.5"></i>Day-Wise Reports
          </
