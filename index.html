<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Log Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 antialiased">

  <!-- AUTH SCREEN OVERLAY -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 bg-opacity-95 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 transition-all">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-indigo-200">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Work Log Portal</h2>
        <p class="text-sm text-gray-500 mt-1">Select your profile to enter</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">User Profile</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <select id="loginUserSelect" required class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition bg-white">
              <!-- Populated dynamically by app.js -->
            </select>
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
          <span>Open Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN NAVIGATION HEADER -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow">
            <i class="fa-solid fa-clipboard-check text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-gray-900 leading-none">Work Log Portal</h1>
            <span class="text-xs text-gray-500">Activity &amp; Day-wise Reporting</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="hidden md:flex space-x-1 bg-gray-100 p-1 rounded-xl text-sm font-medium text-gray-600">
          <button id="navEntryTab" onclick="switchTab('entry')" class="nav-tab px-4 py-1.5 rounded-lg transition bg-white text-indigo-600 shadow-sm">
            <i class="fa-solid fa-plus-circle mr-1.5"></i>Log Activity
          </button>
          <button id="navReportTab" onclick="switchTab('report')" class="nav-tab px-4 py-1.5 rounded-lg transition hover:text-gray-900">
            <i class="fa-solid fa-chart-column mr-1.5"></i>Day-Wise Reports
          </button>
        </nav>

        <!-- User Profile -->
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm" id="userAvatar">
              TA
            </div>
            <div class="hidden sm:block text-left text-xs">
              <div class="font-semibold text-gray-800" id="currentUserName">TA</div>
              <div class="text-gray-400" id="currentUserRole">Operator</div>
            </div>
          </div>
          <button onclick="handleLogout()" class="text-gray-400 hover:text-red-600 p-2 rounded-lg transition" title="Logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Nav Tabs -->
      <div class="flex md:hidden border-t border-gray-100 py-2 space-x-2 text-sm font-medium">
        <button id="mobileNavEntryTab" onclick="switchTab('entry')" class="flex-1 py-2 text-center rounded-lg bg-indigo-50 text-indigo-600">
          Log Activity
        </button>
        <button id="mobileNavReportTab" onclick="switchTab('report')" class="flex-1 py-2 text-center rounded-lg text-gray-600">
          Day-Wise Reports
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- VIEW 1: WORK LOG FORM ENTRY -->
    <section id="entrySection" class="max-w-3xl mx-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
          <div>
            <h2 class="text-lg font-bold text-gray-900" id="formTitleText">New Work Entry</h2>
            <p class="text-xs text-gray-500 mt-0.5">Capture or update operational task details</p>
          </div>
          <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">Secure Portal</span>
        </div>

        <form id="workLogForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Work Date -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Date <span class="text-red-500">*</span>
              </label>
              <input type="date" id="formDate" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <!-- Type of Work -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Type of Work <span class="text-red-500">*</span>
              </label>
              <select id="formTypeOfWork" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                <option value="">Select Category</option>
                <option value="Development">Development</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Inspection">Inspection</option>
                <option value="Support & Troubleshooting">Support & Troubleshooting</option>
                <option value="Documentation">Documentation</option>
                <option value="Administrative">Administrative</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Work Done By -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Work Done By <span class="text-red-500">*</span>
              </label>
              <input type="text" id="formWorkDoneBy" required readonly class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 text-gray-600 cursor-not-allowed">
            </div>

            <!-- Work Done On -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                Work Done On (Asset / System / Target) <span class="text-red-500">*</span>
              </label>
              <input type="text" id="formWorkDoneOn" required placeholder="Project A / Server #12 / Client X" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>
          </div>

          <!-- Description -->
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
              Work Description <span class="text-red-500">*</span>
            </label>
            <textarea id="formDescription" required rows="4" placeholder="Detailed breakdown of tasks executed..." class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"></textarea>
          </div>

          <!-- Submit Buttons -->
          <div class="flex justify-end space-x-3 pt-3">
            <button type="reset" class="px-5 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
              Clear Form
            </button>
            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow-md transition flex items-center space-x-2">
              <i class="fa-solid fa-save"></i>
              <span id="submitBtnText">Save Entry</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- VIEW 2: DAY-WISE REPORT DASHBOARD -->
    <section id="reportSection" class="hidden space-y-6">
      <!-- Filter Bar -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 printable-hide">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          
          <div class="flex flex-wrap items-center gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">Filter Date Range</label>
              <div class="flex items-center space-x-2">
                <input type="date" id="filterStartDate" onchange="renderReports()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-indigo-500 focus:border-indigo-500">
                <span class="text-xs text-gray-400">to</span>
                <input type="date" id="filterEndDate" onchange="renderReports()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-indigo-500 focus:border-indigo-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">Quick Presets</label>
              <div class="flex space-x-1">
                <button onclick="setFilterPreset('today')" class="px-2.5 py-1.5 bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-xs font-medium text-gray-600">Today</button>
                <button onclick="setFilterPreset('yesterday')" class="px-2.5 py-1.5 bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-xs font-medium text-gray-600">Yesterday</button>
                <button onclick="setFilterPreset('thisMonth')" class="px-2.5 py-1.5 bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-xs font-medium text-gray-600">This Month</button>
                <button onclick="setFilterPreset('all')" class="px-2.5 py-1.5 bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-xs font-medium text-gray-600">All</button>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center space-x-2 border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
            <button onclick="exportCSV()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium flex items-center space-x-1.5 shadow-sm transition">
              <i class="fa-solid fa-file-csv"></i>
              <span>Export CSV</span>
            </button>
            <button onclick="window.print()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-medium flex items-center space-x-1.5 shadow-sm transition">
              <i class="fa-solid fa-print"></i>
              <span>Print / PDF</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Overview Metrics -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 printable-hide">
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
          <div class="text-xs font-medium text-gray-500">Logged Entries</div>
          <div class="text-2xl font-bold text-gray-900 mt-1" id="statTotalEntries">0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
          <div class="text-xs font-medium text-gray-500">Active Performers</div>
          <div class="text-2xl font-bold text-indigo-600 mt-1" id="statUniqueStaff">0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
          <div class="text-xs font-medium text-gray-500">Categories Covered</div>
          <div class="text-2xl font-bold text-emerald-600 mt-1" id="statCategories">0</div>
        </div>
      </div>

      <!-- Report Output Wrapper -->
      <div id="reportContainer" class="space-y-6">
        <!-- Day-wise groups populated dynamically by JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
